  --border: #ECE0E6;
  --rose: #C05E7C;
  --rose-wash: #F8E3EA;
  --on-rose: #FFFFFF;
  --blue: #46759E;
  --blue-wash: #E2EDF5;
  --green: #47825F;
  --green-wash: #E0EFE6;
  --chart: #3D7EB8;
  --chart-soft: rgba(61, 126, 184, 0.10);
  --chart-2: #C0537B;
  --shadow: 0 1px 2px rgba(69, 58, 78, 0.05), 0 10px 28px -14px rgba(69, 58, 78, 0.14);
  --radius: 18px;
  --focus: #46759E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1927;
    --surface: #292233;
    --surface-2: #332B40;
    --ink: #F0EAF3;
    --ink-2: #B4A8BF;
    --faint: #837791;
    --border: #3B3247;
    --rose: #E8A4BA;
    --rose-wash: #432C39;
  --on-rose: #35202B;
    --blue: #9BBEDE;
    --blue-wash: #2B3648;
    --green: #99C9AC;
    --green-wash: #2A3B31;
    --chart: #5896DB;
    --chart-soft: rgba(88, 150, 219, 0.14);
    --chart-2: #D06E96;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 28px -14px rgba(0, 0, 0, 0.5);
    --focus: #9BBEDE;
  }
}
:root[data-theme="light"] {
  --bg: #FAF6F4;
  --surface: #FFFFFF;
  --surface-2: #F5EEF1;
  --ink: #453A4E;
  --ink-2: #7A6E84;
  --faint: #A99DB2;
  --border: #ECE0E6;
  --rose: #C05E7C;
  --rose-wash: #F8E3EA;
  --on-rose: #FFFFFF;
  --blue: #46759E;
  --blue-wash: #E2EDF5;
  --green: #47825F;
  --green-wash: #E0EFE6;
  --chart: #3D7EB8;
  --chart-soft: rgba(61, 126, 184, 0.10);
  --chart-2: #C0537B;
  --shadow: 0 1px 2px rgba(69, 58, 78, 0.05), 0 10px 28px -14px rgba(69, 58, 78, 0.14);
  --focus: #46759E;
}
:root[data-theme="dark"] {
  --bg: #1E1927;
  --surface: #292233;
  --surface-2: #332B40;
  --ink: #F0EAF3;
  --ink-2: #B4A8BF;
  --faint: #837791;
  --border: #3B3247;
  --rose: #E8A4BA;
  --rose-wash: #432C39;
  --on-rose: #35202B;
  --blue: #9BBEDE;
  --blue-wash: #2B3648;
  --green: #99C9AC;
  --green-wash: #2A3B31;
  --chart: #5896DB;
  --chart-soft: rgba(88, 150, 219, 0.14);
  --chart-2: #D06E96;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 28px -14px rgba(0, 0, 0, 0.5);
  --focus: #9BBEDE;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(900px 420px at 15% -80px, var(--rose-wash), transparent 70%),
    radial-gradient(700px 380px at 95% 40px, var(--blue-wash), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:is(button, input, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.app, .setup { max-width: 620px; margin: 0 auto; padding: 0 16px 48px; }

/* ---------- type ---------- */
.wordmark {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 480;
  font-size: 21px;
  letter-spacing: 0.01em;
  margin: 0;
}
.wordmark em {
  font-style: italic;
  font-weight: 600;
  color: var(--rose);
}
.eyebrow {
  margin: 0 0 2px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.section-title {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 520;
  font-size: 23px;
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
}
.fine-print { font-size: 12.5px; color: var(--faint); margin: 10px 0 0; }
.empty { color: var(--ink-2); font-size: 14.5px; margin: 4px 0; }

/* ---------- layout ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 2px 6px;
  flex-wrap: wrap;
}
.topbar > :first-child { flex: 1; min-width: 0; }
.icon-btn {
  display: grid; place-items: center;
  width: 36px; height: 36px; flex: none;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--surface); color: var(--ink-2);
}
.icon-btn:hover { color: var(--ink); }

.section { margin-top: 28px; }
.section-head {
  display: flex; align-items: end; justify-content: space-between;
  gap: 12px; margin-bottom: 10px; padding: 0 2px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

/* ---------- banners ---------- */
.banners { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.banner {
  display: flex; align-items: baseline; gap: 10px;
  border-radius: 14px; padding: 11px 14px;
  font-size: 14.5px;
  border: 1px solid transparent;
}
.banner p { margin: 0; flex: 1; }
.banner-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.banner-rose { background: var(--rose-wash); color: var(--ink); border-color: color-mix(in srgb, var(--rose) 30%, transparent); }
.banner-rose .banner-dot { background: var(--rose); }
.banner-rose strong { color: var(--rose); }
.banner-strong { box-shadow: var(--shadow); }
.banner-blue { background: var(--blue-wash); }
.banner-blue .banner-dot { background: var(--blue); }
.banner-blue strong { color: var(--blue); }
.banner-green { background: var(--green-wash); }
.banner-green .banner-dot { background: var(--green); }
.banner-green strong { color: var(--green); }
.banner-x {
  background: none; border: none; color: var(--ink-2);
  font-size: 18px; line-height: 1; padding: 0 2px; align-self: center;
}

/* ---------- hero ---------- */
.hero {
  margin-top: 14px; padding: 22px 20px 18px;
  position: relative; overflow: hidden;
}
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%;
  filter: blur(34px); opacity: 0.8; pointer-events: none;
}
.hero::before {
  width: 240px; height: 240px; top: -110px; right: -70px;
  background: radial-gradient(circle, var(--rose-wash), transparent 70%);
}
.hero::after {
  width: 260px; height: 260px; bottom: -130px; left: -80px;
  background: radial-gradient(circle, var(--blue-wash), transparent 70%);
}
.hero > * { position: relative; z-index: 1; }
.hero-greeting {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-size: 17px;
  font-weight: 460;
  color: var(--ink-2);
  margin: 0 0 14px;
}
.hero-heart { color: var(--rose); font-style: normal; font-size: 15px; }
.hero-grid {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 14px; align-items: start;
}
.hero-divider { width: 1px; background: var(--border); align-self: stretch; }
.hero-cell:last-child { text-align: right; }
.hero-label {
  margin: 0; font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
}
.hero-big {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 500;
  font-size: clamp(44px, 13vw, 62px);
  line-height: 1.05;
  margin: 2px 0 0;
  font-variant-numeric: tabular-nums;
}
.hero-unit { font-size: 0.42em; color: var(--ink-2); font-weight: 460; }
.hero-days { color: var(--rose); font-weight: 600; }
.hero-sub { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }

.progress { margin-top: 18px; }
.progress-track {
  position: relative; height: 10px; border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--green) 0%, var(--blue) 55%, var(--rose) 100%);
  opacity: 0.85;
  transition: width 0.6s ease;
}
.progress-tick {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--bg);
}
.progress-labels {
  display: flex; justify-content: space-between;
  font-size: 11.5px; color: var(--faint); margin-top: 6px;
  font-variant-numeric: tabular-nums;
}

/* ---------- baby card ---------- */
.week-nav { display: flex; gap: 6px; }
.week-nav button {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--ink-2); font-size: 18px; line-height: 1;
}
.week-nav button:disabled { opacity: 0.35; cursor: default; }
.week-nav button:not(:disabled):hover { color: var(--ink); }

.baby-top { display: flex; gap: 16px; align-items: center; }
.baby-visual {
  flex: none; width: 88px; height: 88px; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 32% 28%, var(--rose-wash), var(--blue-wash));
  border: 1px solid var(--border);
}
.baby-emoji { font-size: 44px; line-height: 1; }
.baby-drawn { display: grid; place-items: center; }
.baby-drawn svg { display: block; }
.baby-word {
  font-family: "Fraunces", Georgia, serif;
  font-size: 15px; font-weight: 560; text-align: center;
  padding: 0 8px; color: var(--ink); line-height: 1.15;
}
.baby-size-line { margin: 0; font-size: 13px; color: var(--ink-2); }
.baby-item {
  font-family: "Fraunces", Georgia, serif;
  font-size: 25px; font-weight: 540; line-height: 1.15;
  margin: 0 0 8px; text-wrap: balance;
}
.baby-dates {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 0 0 12px;
}
.baby-dates-range {
  font-size: 14px; font-weight: 600; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.baby-dates-tag {
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--rose); background: var(--rose-wash);
  padding: 2px 8px; border-radius: 999px;
}
.baby-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.baby-stats dt {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint);
}
.baby-stats dd {
  margin: 1px 0 0; font-size: 13.5px; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.ruler {
  height: 6px; border-radius: 999px; background: var(--surface-2);
  margin-top: 16px; overflow: hidden;
}
.ruler-fill {
  height: 100%; border-radius: 999px; background: var(--green); opacity: 0.7;
  transition: width 0.5s ease;
}
.ruler-caption { margin: 5px 0 0; font-size: 11.5px; color: var(--faint); }
.baby-note { margin: 12px 0 0; font-size: 14.5px; color: var(--ink-2); max-width: 52ch; }

/* ---------- buttons & chips ---------- */
.btn-primary {
  background: linear-gradient(135deg, var(--rose), color-mix(in srgb, var(--rose) 72%, var(--blue)));
  color: var(--on-rose);
  border: none; border-radius: 12px;
  padding: 11px 20px; font-weight: 600; font-size: 15px;
}
.btn-primary:disabled { opacity: 0.45; cursor: default; }
.btn-block { width: 100%; }
.btn-small {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600;
  color: var(--ink-2);
}
.btn-small:hover { color: var(--ink); }
.btn-ghost {
  background: none; border: none; color: var(--blue);
  font-size: 13.5px; font-weight: 600; padding: 8px 2px 0;
}
.btn-danger {
  background: none; border: 1px solid var(--rose); color: var(--rose);
  border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 600;
}
.chip {
  display: inline-block; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; padding: 2px 9px;
  white-space: nowrap;
}
.chip-rose { background: var(--rose-wash); color: var(--rose); }
.chip-blue { background: var(--blue-wash); color: var(--blue); }
.chip-green { background: var(--green-wash); color: var(--green); margin-left: 8px; }
.chip-plain { background: var(--surface-2); color: var(--ink-2); }

/* ---------- timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.tl-item {
  display: flex; gap: 14px; position: relative; padding: 0 0 18px;
}
.tl-item:last-child { padding-bottom: 2px; }
.tl-item::before {
  content: ""; position: absolute; left: 9px; top: 22px; bottom: 0;
  width: 2px; background: var(--border);
}
.tl-item:last-child::before { display: none; }
.tl-marker {
  flex: none; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; margin-top: 2px;
  border: 2px solid var(--border); background: var(--surface);
  color: #fff; position: relative; z-index: 1;
}
.tl-past .tl-marker { background: var(--green); border-color: var(--green); }
.tl-open .tl-marker { border-color: var(--green); box-shadow: 0 0 0 4px var(--green-wash); }
.tl-past .tl-title, .tl-past .tl-desc, .tl-past .tl-when { color: var(--faint); }
.tl-title { margin: 0; font-weight: 600; font-size: 15px; }
.tl-when { margin: 1px 0 3px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl-desc { margin: 0; font-size: 13.5px; color: var(--ink-2); max-width: 48ch; }

/* ---------- appointments ---------- */
.appt-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field-label em { font-style: normal; font-weight: 400; color: var(--faint); }
.field-hint { font-size: 12px; color: var(--faint); }
.field input, .note-row input, .weight-row input {
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); padding: 10px 12px; font-size: 15px;
  width: 100%; min-width: 0;
}
.field-row { display: flex; gap: 12px; }
.ga-row { display: flex; gap: 10px; }
.ga-input { display: flex; align-items: center; gap: 7px; flex: 1; }
.ga-input input { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 10px 12px; font-size: 15px; }
.ga-input span { font-size: 13px; color: var(--ink-2); }

.appt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.appt {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
}
.appt-today { background: var(--rose-wash); border-color: color-mix(in srgb, var(--rose) 30%, transparent); }
.appt-date {
  flex: none; width: 46px; text-align: center;
  background: var(--surface-2); border-radius: 10px; padding: 5px 0 6px;
}
.appt-today .appt-date { background: var(--surface); }
.appt-mon { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose); }
.appt-day { display: block; font-family: "Fraunces", Georgia, serif; font-size: 20px; font-weight: 540; line-height: 1.1; font-variant-numeric: tabular-nums; }
.appt-body { flex: 1; min-width: 0; }
.appt-title { margin: 0; font-weight: 600; font-size: 15px; }
.appt-sub { margin: 0; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.appt-past { opacity: 0.6; }
.row-x {
  background: none; border: none; color: var(--faint);
  font-size: 18px; line-height: 1; padding: 4px 6px; flex: none;
}
.row-x:hover { color: var(--rose); }
.past-appts { margin-top: 14px; }
.past-appts summary { font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.past-appts > ul, .past-appts > table { margin-top: 10px; }

/* ---------- symptoms ---------- */
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.sym-chip {
  border: 1px solid var(--border); background: var(--bg);
  border-radius: 999px; padding: 7px 14px; font-size: 13.5px;
  color: var(--ink-2);
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.sym-chip.is-on {
  background: var(--green-wash); border-color: var(--green);
  color: var(--green); font-weight: 600;
}
.note-row { margin-top: 12px; }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.history li { display: flex; gap: 10px; font-size: 13.5px; }
.history-date { flex: none; width: 52px; color: var(--faint); font-variant-numeric: tabular-nums; }
.history-body { color: var(--ink-2); }

/* ---------- weight ---------- */
.unit-toggle {
  display: inline-flex; border: 1px solid var(--border);
  border-radius: 999px; overflow: hidden; background: var(--surface);
}
.unit-toggle button {
  border: none; background: none; padding: 5px 14px;
  font-size: 13px; font-weight: 600; color: var(--ink-2);
}
.unit-toggle button.is-active { background: var(--blue-wash); color: var(--blue); }
.weight-row { display: flex; gap: 10px; margin-bottom: 14px; }
.weight-row input { flex: 1; }
.weight-row .btn-primary { flex: none; }

.chart-wrap { position: relative; touch-action: pan-y; }
.grid-line { stroke: var(--border); stroke-width: 1; }
.axis-text { fill: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart-area { fill: var(--chart-soft); stroke: none; }
.chart-line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.chart-dot.is-last { stroke-width: 2.5; }
.crosshair { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-endlabel { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart-tip {
  position: absolute; top: 0; transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  border-radius: 9px; padding: 5px 10px;
  display: flex; flex-direction: column; align-items: center;
  font-size: 11.5px; line-height: 1.4; pointer-events: none;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.tip-strong { font-weight: 700; font-size: 12.5px; }
.weight-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.weight-table th {
  text-align: left; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--faint); font-weight: 600;
  padding: 4px 8px 6px 0; border-bottom: 1px solid var(--border);
}
.weight-table td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); color: var(--ink-2); }
.weight-table tr:last-child td { border-bottom: none; }

/* ---------- badges ---------- */
.badge-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 14px;
}
.badge {
  text-align: center; padding: 14px 8px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
  opacity: 0.55;
}
.badge.is-earned { opacity: 1; box-shadow: var(--shadow); }
.badge-seal {
  width: 54px; height: 54px; margin: 0 auto 8px;
  border-radius: 50%; display: grid; place-content: center;
  border: 2px dashed var(--border); color: var(--faint);
}
.badge.is-earned .badge-seal {
  border: 2px solid transparent;
  background:
    radial-gradient(circle at 30% 25%, var(--rose-wash), var(--surface) 75%) padding-box,
    linear-gradient(135deg, var(--green), var(--blue), var(--rose)) border-box;
  color: var(--ink);
}
.badge-week {
  font-family: "Fraunces", Georgia, serif;
  font-size: 21px; font-weight: 560; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.badge-wk { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.badge-name { margin: 0; font-size: 13px; font-weight: 600; }
.badge-sub { margin: 1px 0 0; font-size: 11px; color: var(--faint); }

/* ---------- setup ---------- */
.setup { display: flex; min-height: 100vh; align-items: center; }
.setup-inner { width: 100%; padding: 40px 0; }
.setup-title {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 520; font-size: clamp(30px, 8vw, 40px);
  line-height: 1.12; margin: 18px 0 10px; text-wrap: balance;
}
.setup-lede { color: var(--ink-2); font-size: 16px; margin: 0 0 26px; max-width: 44ch; }
.mode-picker { border: none; margin: 0 0 18px; padding: 0; }
.mode-picker legend { padding: 0; margin-bottom: 8px; }
.mode-row { display: flex; gap: 8px; flex-wrap: wrap; }
.mode-tab {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600;
  color: var(--ink-2);
}
.mode-tab.is-active { background: var(--blue-wash); border-color: var(--blue); color: var(--blue); }
.scan-fields { display: flex; flex-direction: column; gap: 14px; }
.setup .field { margin-bottom: 4px; }
.setup-error { color: var(--rose); font-size: 14px; margin: 12px 0 0; }
.setup-preview {
  margin: 18px 0 0; padding: 14px 16px;
  background: var(--green-wash); border-radius: 14px;
}
.preview-main { margin: 0; font-size: 17px; }
.preview-main strong { font-family: "Fraunces", Georgia, serif; font-weight: 560; }
.preview-sub { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); }
.setup .btn-primary { margin-top: 20px; width: 100%; padding: 14px; }
.setup-lock { font-size: 12.5px; color: var(--faint); margin: 14px 0 0; max-width: 46ch; }

/* ---------- settings modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(30, 22, 38, 0.45);
  display: grid; place-items: center; padding: 20px; z-index: 50;
}
.modal {
  background: var(--surface); border-radius: 20px;
  width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 0;
}
.modal-head h2 { font-family: "Fraunces", Georgia, serif; font-weight: 540; font-size: 21px; margin: 0; }
.modal-body { padding: 8px 20px 22px; display: flex; flex-direction: column; gap: 20px; }
.setting-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 0 0 4px; }
.setting-value { font-family: "Fraunces", Georgia, serif; font-size: 19px; font-weight: 540; margin: 0; }
.setting .fine-print { margin-top: 5px; }
.setting-danger { border-top: 1px solid var(--border); padding-top: 18px; }
.setting-danger .btn-danger { margin-top: 10px; }
.confirm-row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }

.setting-input {
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); padding: 10px 12px; font-size: 15px;
  width: 100%; max-width: 260px;
}

/* ---------- vitamins & medicines ---------- */
.med-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.med {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
}
.med-due { background: var(--rose-wash); border-color: color-mix(in srgb, var(--rose) 30%, transparent); }
.med-done { opacity: 0.72; }
.med-check {
  flex: none; width: 26px; height: 26px; border-radius: 9px;
  border: 2px solid var(--border); background: var(--bg);
  display: grid; place-items: center; color: transparent;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.med-done .med-check { background: var(--green); border-color: var(--green); color: #fff; }
.med-body { flex: 1; min-width: 0; cursor: pointer; }
.med-name { margin: 0; font-weight: 600; font-size: 15px; }
.med-done .med-name { text-decoration: line-through; text-decoration-color: var(--faint); }
.med-time { margin: 0; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- blood pressure ---------- */
.bp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.bp-row input {
  flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); padding: 10px 12px; font-size: 15px;
  font-variant-numeric: tabular-nums; text-align: center;
}
.bp-slash { color: var(--faint); font-size: 20px; }
.bp-row .btn-primary { flex: none; }
.chart-legend {
  display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2);
  margin-bottom: 6px;
}
.chart-legend .dot {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  margin-right: 5px; transform: translateY(0.5px);
}
.dot-sys { background: var(--chart-2); }
.dot-dia { background: var(--chart); }
.line-sys { stroke: var(--chart-2); }
.line-dia { stroke: var(--chart); }
.dot-sys-svg { fill: var(--chart-2); }
.dot-dia-svg { fill: var(--chart); }

/* ---------- labs & vaccines ---------- */
.rec-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rec {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
}
.rec .chip { flex: none; }
.rec-body { flex: 1; min-width: 0; }
.rec-name { margin: 0; font-weight: 600; font-size: 15px; }
.rec-sub { margin: 0; font-size: 12.5px; color: var(--ink-2); }

/* ---------- today (day by day) card ---------- */
.today-card {
  border-color: var(--rose);
  background:
    radial-gradient(120% 80% at 100% 0%, var(--rose-wash), transparent 60%),
    var(--surface);
}
.today-head { margin-bottom: 12px; }
.today-date {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 2px; font-size: 14.5px; font-weight: 600; color: var(--ink);
}
.today-badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--on-rose); background: var(--rose);
  padding: 2px 9px; border-radius: 999px;
}
.today-ga {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 0; font-family: "Fraunces", Georgia, serif;
  font-size: 20px; font-weight: 520; color: var(--ink);
}
.today-daynum {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  letter-spacing: 0.01em;
}
.today-note {
  margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--ink);
  text-wrap: pretty;
}
.day-strip {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
}
.day-pill {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg); color: var(--ink-2); position: relative;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.day-pill:hover { border-color: var(--rose); color: var(--ink); }
.day-dow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; }
.day-num { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.day-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.day-pill.is-today .day-dot { background: var(--rose); }
.day-pill.is-today { border-color: var(--rose); }
.day-pill.is-sel {
  background: var(--rose); border-color: var(--rose);
}
.day-pill.is-sel .day-dow,
.day-pill.is-sel .day-num { color: var(--on-rose); }
.day-pill.is-sel .day-dot { background: var(--on-rose); }
.today-card .btn-ghost { margin-top: 14px; }

/* ---------- appointment gestational-age ---------- */
.appt-ga-preview {
  margin: 2px 0 12px; padding: 10px 12px;
  background: var(--blue-wash); border-radius: 10px;
  font-size: 13.5px; color: var(--ink-2);
}
.appt-ga-preview strong { color: var(--blue); font-weight: 600; }
.appt-ga {
  color: var(--rose); font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ---------- tab navigation ---------- */
.tab-nav {
  display: flex; gap: 4px;
}
.tab-btn {
  border: none; background: transparent; color: var(--ink-2); cursor: pointer;
  padding: 8px 12px; font-size: 14px; font-weight: 500;
  border-bottom: 2px solid transparent; transition: all 0.2s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.is-active {
  color: var(--ink); border-bottom-color: var(--rose);
}

/* ---------- weeks timeline ---------- */
.weeks-view { padding-top: 8px; }
.weeks-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;
}
.week-card {
  border: 1px solid var(--border); border-radius: 14px; padding: 12px;
  background: var(--surface); text-align: center; transition: all 0.2s;
  cursor: default;
}
.week-card.is-current {
  border-color: var(--rose); background: var(--rose-wash);
}
.week-card:hover {
  border-color: var(--rose); box-shadow: var(--shadow);
}
.week-num {
  font-weight: 600; font-size: 14px; color: var(--ink);
  margin-bottom: 8px;
}
.week-size {
  display: flex; justify-content: center; margin: 8px 0;
  height: 56px; align-items: center;
}
.week-size svg { width: 52px; height: 52px; }
.size-placeholder {
  font-size: 11px; color: var(--faint);
  font-weight: 600; letter-spacing: 0.5px;
}
.week-dates {
  font-size: 12px; color: var(--ink-2); margin-bottom: 6px;
}
.week-status {
  font-size: 11px; color: var(--faint); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.3px;
  margin-bottom: 8px;
}
.week-item {
  font-size: 12px; color: var(--ink); font-weight: 500;
  padding-top: 8px; border-top: 1px solid var(--border);
  margin-top: 8px;
}
.week-appts {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
}
.week-appt {
  font-size: 11px; color: var(--rose); font-weight: 500;
  padding: 4px 6px; background: var(--rose-wash); border-radius: 6px;
  margin-top: 4px;
}

/* ---------- footer ---------- */
.footer { margin-top: 40px; padding: 0 2px; }
.footer p { font-size: 12.5px; color: var(--faint); margin: 0 0 6px; max-width: 56ch; }
.footer-love {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-size: 15px !important;
  color: var(--ink-2) !important;
  margin-bottom: 10px !important;
}
.footer-sub { font-size: 12px; }

/* ---------- wider screens ---------- */
@media (min-width: 560px) {
  .hero { padding: 28px 28px 22px; }
  .card { padding: 22px; }
}

  `)};var Vp={4:["Your baby is a tiny ball of cells that has just nestled into the uterus lining \u2014 the journey officially begins.","The neural tube, which becomes the brain and spinal cord, is starting to form along your baby's back.","Three layers of cells are taking shape today, each destined to become different parts of your baby's body.","The very first blood cells are appearing, and the placenta is beginning to develop to nourish your baby.","A good day to keep up a prenatal vitamin with folic acid \u2014 it protects that forming neural tube.","You may not feel any different yet, and that's completely normal \u2014 so much is happening too small to feel.","By the end of this week your baby is about the size of a poppy seed \u2014 impossibly small, wonderfully real."],5:["Your baby's heart is beginning to form this week, along with the earliest blood vessels.","The neural tube is closing at both ends now, sealing in the future brain and spine.","Tiny buds that become the placenta are burrowing in to bring your baby oxygen and food.","Your baby now has three distinct layers that will build the nervous system, organs, muscles and skin.","Early signs like tender breasts or tiredness may start \u2014 your body is working hard.","Staying hydrated and resting when you can helps you through these first weeks of big changes.","Your baby is about the size of a sesame seed, with a heart that will soon start to beat."],6:["A tiny heart has begun to beat this week \u2014 around 100 to 110 times a minute.","Your baby's face is taking shape, with small dark spots where the eyes will be.","Little buds that grow into arms and legs are appearing on each side.","The brain is forming its major sections, and the neural tube is fully closed.","Morning sickness can peak around now \u2014 small, frequent snacks often help more than big meals.","Ginger, cold water, and plain crackers are gentle friends if nausea visits today.","Your baby is about the size of a lentil, growing rounder and more curled each day."],7:["Your baby's brain is growing incredibly fast, adding thousands of new cells every minute.","Hands and feet are emerging as tiny paddles at the ends of the arm and leg buds.","The kidneys are getting ready to begin their lifelong job of filtering.","Your baby's mouth and tongue are starting to form this week.","Nostrils are appearing on the tiny face, and the lenses of the eyes are developing.","If food aversions are strong, eat whatever stays down \u2014 variety can wait a few weeks.","Your baby is about the size of a blueberry, with a body that's straightening out a little."],8:["Fingers and toes are forming this week, still a little webbed but taking shape.","Your baby is beginning to make tiny, spontaneous movements \u2014 far too small to feel yet.","Breathing tubes are extending from the throat toward the developing lungs.","The little tail from early development is disappearing as your baby looks more human.","Eyelids are forming to protect the developing eyes.","Your first prenatal visit often falls around now \u2014 jot down any questions beforehand.","Your baby is about the size of a kidney bean and moving in gentle waves."],9:["All of your baby's essential organs are now in place and starting to grow.","Tiny muscles are forming, and your baby can make small movements of the arms and legs.","The heart has finished dividing into its four chambers today.","External ears are becoming visible, and the taste buds are forming.","Your baby's tail is completely gone now \u2014 a fully formed little shape remains.","If you're wiped out, know the exhausting first trimester often eases by week 12\u201314.","Your baby is about the size of a cherry, with a strong, quick heartbeat."],10:["Your baby's joints are working now \u2014 arms and legs can bend at the elbows and knees.","Tooth buds are forming under the gums, the beginnings of that future smile.","The stomach is producing digestive juices and the kidneys are making urine.","Fingernails and tiny hairs are beginning to appear.","Your baby is officially a fetus now, past the delicate early embryo stage.","Vital organs are all formed and will spend the coming months maturing and growing.","Your baby is about the size of a kumquat, swallowing and kicking in miniature."],11:["Your baby is practicing breathing motions and can open and close tiny fists.","Hair follicles are forming, and the fingers and toes are fully separated now.","The bones are beginning to harden, especially in the arms and legs.","Your baby's ears are moving toward their final position on the head.","Tooth buds keep forming, and the tongue now has taste buds.","Many people find nausea starting to ease around now \u2014 hang in there if it hasn't yet.","Your baby is about the size of a strawberry, stretching and wiggling often."],12:["Reflexes are kicking in \u2014 fingers curl, toes flex, and the mouth makes sucking motions.","Your baby's digestive system is practicing contractions, getting ready for after birth.","The kidneys are producing urine that your baby releases into the amniotic fluid.","Bone marrow is starting to make white blood cells for a future immune system.","Your baby's face now looks distinctly human, with the eyes closer together.","The end of the first trimester is near \u2014 a big, reassuring milestone.","Your baby is about the size of a kiwi, with fully formed fingers and toes."],13:["Fingerprints are forming this week \u2014 a one-of-a-kind pattern already.","Your baby's vocal cords are beginning to develop.","The intestines are moving from the umbilical cord into the belly where they belong.","Tiny bones are forming in the arms and legs, and the head is more in proportion.","Welcome to the last week of the first trimester \u2014 you've come so far.","Energy often returns in the second trimester; you may feel more like yourself soon.","Your baby is about the size of a pea pod, lean and increasingly active."],14:["Welcome to the second trimester \u2014 your baby can squint, frown, and maybe suck a thumb.","The roof of your baby's mouth is forming, and the facial muscles are getting a workout.","Your baby's liver, kidneys and spleen are all up and running now.","Fine downy hair called lanugo is starting to grow over your baby's body.","Your baby's neck is getting longer and the head sits more upright.","This trimester is often the most comfortable \u2014 a good time for gentle movement and rest.","Your baby is about the size of a lemon, with more defined features every day."],15:["Your baby can sense light now, even through closed eyelids.","The bones are getting stronger and will start showing up on scans.","Your baby is forming taste buds and practicing swallowing amniotic fluid.","Tiny leg bones are lengthening, so the legs are now longer than the arms.","Your baby may be hiccuping, though you won't feel it just yet.","You might notice energy and appetite returning \u2014 nourish it with good food.","Your baby is about the size of an apple, wriggling with growing strength."],16:["Your baby's heart is pumping about 25 quarts of blood a day now.","The pattern of the scalp is forming, though hair may not be visible yet.","Your baby's eyes are working, making small side-to-side movements.","Little back muscles are strengthening so your baby can straighten out more.","Some people feel the very first flutters around now \u2014 keep an ear out.","If you feel gentle bubbles low in your belly, that could be your baby saying hello.","Your baby is about the size of an avocado, limber and lively."],17:["Your baby's skeleton is changing from soft cartilage to bone this week.","Sweat glands are starting to develop in your baby's skin.","The umbilical cord is growing stronger and thicker to support your growing baby.","Your baby's heartbeat is now guided by the brain, not just beating on its own.","A protective layer of fat is beginning to form under the skin.","As your belly grows, sleeping on your side with a pillow can be more comfortable.","Your baby is about the size of a pear, practicing sucking and swallowing."],18:["Your baby's ears are in place and hearing is developing \u2014 your voice is becoming familiar.","A nerve insulation called myelin is beginning to form around the nerves.","Your baby is yawning, hiccuping, and stretching inside you.","If it's a girl, her reproductive organs are forming; if a boy, the genitals are developing.","Your baby's unique fingerprints and footprints are fully set now.","Talking, reading, or singing to your baby is a lovely way to bond this week.","Your baby is about the size of a bell pepper and increasingly aware of sound."],19:["A protective, waxy coating called vernix is forming over your baby's skin.","Your baby's senses \u2014 smell, taste, hearing, sight and touch \u2014 are developing fast.","If it's a girl, millions of eggs are already forming in her tiny ovaries.","Your baby's arms and legs are now in proportion with the rest of the body.","Hair is beginning to sprout on your baby's scalp.","Movements may be getting stronger and more regular \u2014 enjoy those little kicks.","Your baby is about the size of a mango, coated and cozy."],20:["Halfway there \u2014 your baby swallows more now, good practice for the digestive system.","Your baby is producing meconium, the first stool, in the intestines.","The anatomy scan often happens around now \u2014 a long, lovely look at your baby.","Your baby's sense of taste is developing and may be flavored by what you eat.","If it's a girl, her uterus is fully formed; a boy's testes are beginning to descend.","Twenty weeks down, twenty to go \u2014 take a moment to celebrate this milestone.","Your baby is about the size of a banana, active and growing steadily."],21:["Those flutters are becoming real, coordinated kicks you can feel more clearly.","Your baby's digestive system is practicing absorbing sugars from the amniotic fluid.","Bone marrow is now the main source of your baby's blood cells.","Your baby's eyebrows and eyelids are fully formed.","Rhythms of sleeping and waking are developing \u2014 you may notice active and quiet times.","Feeling movement is a good moment to start noticing your baby's patterns.","Your baby is about the size of a carrot, kicking with new strength."],22:["Your baby looks like a miniature newborn now, with lips, eyelids, and eyebrows.","Your baby's sense of touch is developing \u2014 they may stroke their face or grasp the cord.","The inner ear is fully developed, giving your baby a sense of balance.","If it's a boy, the testes begin descending; a girl's ovaries hold her lifetime of eggs.","Your baby's lips and mouth are more sensitive, and taste buds are forming.","Your bump is likely obvious now \u2014 comfortable clothes and good support help.","Your baby is about the size of a cucumber, plumping up week by week."],23:["Your baby's hearing is sharp enough to notice loud sounds \u2014 and your heartbeat, always.","Your baby's skin is a little wrinkled and red, waiting for fat to fill it out.","Blood vessels in the lungs are developing to get ready for breathing air.","Your baby may startle at sudden loud noises with a little jump.","Rapid eye movements are beginning, a sign of developing sleep cycles.","Familiar music or your voice may soothe your baby now and after birth.","Your baby is about the size of a grapefruit, responsive and growing."],24:["Your baby's lungs are growing the branches they'll need for that first breath.","Your baby's face is almost fully formed, with tiny eyelashes and eyebrows.","The inner ear is fully developed, so your baby's sense of balance is working.","Your baby's skin is becoming less transparent as pigment develops.","The glucose screening test is often offered around this stretch \u2014 a routine sugar check.","Your baby is now considered viable, a reassuring developmental marker.","Your baby is about the size of an ear of corn, filling out steadily."],25:["Baby fat is starting to fill in \u2014 the skin is getting smoother and pinker.","Your baby's hair is growing and may even have color and texture now.","The hands are fully developed with tiny, working fingers and nails.","Your baby's nostrils are opening, practicing breathing motions with amniotic fluid.","Blood vessels are developing in the lungs, another step toward that first breath.","You may notice more defined kicks and jabs \u2014 some even visible from outside.","Your baby is about the size of a rutabaga, rounder and stronger."],26:["Your baby's eyes are beginning to open, and the eyelashes are fully grown.","Your baby is inhaling and exhaling small amounts of amniotic fluid to develop the lungs.","Brain-wave activity for hearing and sight is picking up this week.","Your baby may respond to your voice and touch with a little movement.","The lungs are making surfactant, which will help them expand after birth.","A quiet daily moment to feel your baby move can be a sweet habit to start.","Your baby is about the size of a bunch of scallions, alert and active."],27:["Your baby is sleeping and waking in cycles now \u2014 and possibly hiccuping, which you may feel.","This is the last week of the second trimester \u2014 the home stretch is near.","Your baby's brain is very active, developing new tissue and connections fast.","The lungs are still immature but could function with help if needed.","Your baby can open and close their eyes and may sense bright light through your belly.","The Tdap vaccine is commonly offered between now and week 36 to protect your baby.","Your baby is about the size of a cauliflower, curling and stretching."],28:["Third trimester \u2014 your baby can blink and may even dream during REM sleep.","Your baby's eyesight is developing, and they can now perceive light and dark.","Billions of neurons are developing in your baby's rapidly growing brain.","Your baby is adding body fat and looking less wrinkled every day.","Prenatal visits may become more frequent from here to keep a close watch.","Noticing your baby's movements each day helps you learn their patterns.","Your baby is about the size of an eggplant, plump and increasingly strong."],29:["Your baby's muscles and lungs are busy maturing, and the head is growing for the brain.","Your baby's bones are fully formed but still soft, soaking up calcium daily.","Kicks and jabs may feel stronger and sharper as space gets snug.","Your baby can regulate their own body temperature a little better now.","The brain's surface is folding into grooves that give it more room to grow.","Iron-rich foods support the extra blood you and your baby need this trimester.","Your baby is about the size of a butternut squash, muscular and active."],30:["Your baby's eyesight is developing \u2014 after birth, your face will be the favorite thing to study.","The soft lanugo hair is beginning to disappear as fat keeps your baby warm.","Your baby's bone marrow has fully taken over red blood cell production.","Your baby may be less acrobatic now, but movements should stay regular.","The brain is growing rapidly, taking on that familiar wrinkled appearance.","Practicing relaxation and breathing now can help you feel ready for labor.","Your baby is about the size of a cabbage, cozy and increasingly plump."],31:["Your baby can turn their head side to side, and arms and legs are plumping up.","Your baby's brain is working fast, and all five senses are functioning.","The lungs are more developed, practicing breathing rhythms daily.","Your baby is likely settling into more regular sleep and wake cycles.","You may feel rhythmic little jumps \u2014 those are hiccups, completely normal.","Swelling in the feet is common now; putting your feet up helps.","Your baby is about the size of a coconut, strong and responsive."],32:["Toenails have arrived, and your baby is practicing breathing around the clock.","Your baby's skin is becoming opaque and soft as fat continues to build.","Many babies have settled head-down around now, though there's still time to turn.","Your baby's fingernails have reached the tips of the fingers.","The layer of soft lanugo hair is mostly gone, leaving smooth skin.","As your bump grows, smaller and more frequent meals can ease heartburn.","Your baby is about the size of a jicama, filling out beautifully."],33:["Your baby's bones are hardening \u2014 except the skull, which stays flexible for the journey out.","Your baby's immune system is developing as antibodies pass from you to them.","Your baby can detect light and may turn toward a bright glow on your belly.","The amniotic fluid is near its peak, giving your baby room to move for now.","Your baby's brain and nervous system are fully developed in their basic form.","Packing a hospital bag can wait a bit, but it's a good idea to plan soon.","Your baby is about the size of a pineapple, rounder and stronger."],34:["Your baby's central nervous system and lungs are maturing beautifully.","Your baby's fingernails now reach the fingertips and may need a trim after birth.","The waxy vernix coating on the skin is getting thicker to protect your baby.","If it's a boy, the testes are making their way down around now.","Your baby's eyes can focus, and the pupils narrow and widen with light.","Knowing the signs of early labor is wise, though most babies stay put a while longer.","Your baby is about the size of a cantaloupe, snug and thriving."],35:["Growth now is mostly about gaining weight \u2014 cozy and increasingly snug in there.","Your baby's kidneys are fully developed and the liver is processing some waste.","Most of your baby's basic development is complete; now it's about growing.","Your baby's arms and legs are getting chubby and their grip is strong.","Space is tight, so movements may feel like rolls and stretches more than kicks.","Group B strep testing is often done around weeks 36\u201337 \u2014 a quick, routine swab.","Your baby is about the size of a honeydew melon, plump and still growing."],36:["Your baby is shedding the downy hair and vernix that protected their skin.","Your baby is swallowing that vernix and lanugo, forming the first meconium stool.","Weekly prenatal visits usually begin around now as your due date approaches.","Your baby is likely head-down and settling lower into your pelvis.","Your baby's lungs are nearly ready to take their first breath of air.","Packing your hospital bag and finalizing plans is a good idea this week.","Your baby is about the size of a head of romaine, almost full-term."],37:["Early term \u2014 your baby is practicing everything: breathing, sucking, gripping, blinking.","Your baby's brain and lungs are still maturing, so every day inside counts.","Your baby is producing surfactant to help the lungs work after birth.","Your baby's head may be settling deeper into your pelvis, getting into position.","You may notice more Braxton Hicks practice contractions as your body prepares.","Knowing the signs of real labor helps you feel ready \u2014 rest up while you can.","Your baby is about the size of a bunch of chard, nearly ready to meet you."],38:["Your baby has a firm grip already \u2014 strong enough to hold your finger soon.","Your baby's organs are fully developed and ready to function on their own.","The vernix and lanugo are mostly gone, leaving smooth newborn skin.","Your baby is building the last layers of fat that will keep them warm and round.","Your baby's brain is still growing quickly and will keep doing so after birth.","Any sign of labor is worth noting now \u2014 trust your instincts and your team.","Your baby is about the size of a leek, fully formed and gaining weight."],39:["Full term \u2014 your baby is ready and simply putting on the finishing touches.","Your baby's lungs are fully mature and producing plenty of surfactant.","The umbilical cord is passing antibodies to protect your baby after birth.","Your baby's skin is now smooth and covered in a fresh, soft layer.","Your baby's brain and nervous system are ready for the outside world.","Rest, hydrate, and watch for labor signs \u2014 your baby could arrive any day.","Your baby is about the size of a mini watermelon, ready when they are."],40:["Due date week \u2014 however long it takes from here, you're both ready.","Your baby is fully developed and just waiting for the right moment to arrive.","Only about 1 in 20 babies arrive exactly on their due date, so be patient.","Your baby is still growing hair and nails even now.","Watch for regular contractions, your water breaking, or your care team's guidance.","Try to rest and stay calm \u2014 the finish line is right here.","Your baby is about the size of a small pumpkin, ready to meet you."],41:["Taking a little extra time \u2014 your baby keeps growing, and any day could be the day.","Your care team may discuss monitoring or options if your baby is comfortable staying put.","Your baby is alert and active; keep noticing their movements each day.","Extra checks like a non-stress test may be offered to make sure all is well.","Your baby is still perfectly cozy, though space is very snug now.","Staying in touch with your care team is key this week \u2014 trust their guidance.","Your baby is about the size of a jackfruit, ready and waiting."],42:["Any moment now \u2014 your care team is watching closely, and the finish line is right here.","Your baby is fully ready; your team will guide the safest timing from here.","Post-date monitoring helps make sure your baby stays healthy until birth.","Your baby's skin may be a little dry after all this time in the water \u2014 completely normal.","Trust your care team's recommendations about the next steps this week.","Whatever the path to meeting your baby, you've carried them beautifully.","Your baby is about the size of a watermelon \u2014 the wait is nearly over."]},cd="These very early days are quiet on the outside, but inside, the tiniest beginnings are taking shape. Your baby's story is just starting.";function dd(e,t){if(e<4)r
